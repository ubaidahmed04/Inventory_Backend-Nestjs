name: Build and Deploy SPOS Backend

on:
  push:
    branches: [main]   # ya jo bhi apki main branch he (master/main)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/spos-backend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/spos-backend:latest
            docker stop spos-backend || true
            docker rm spos-backend || true
            docker run -d --name spos-backend -p 3002:3000 --restart unless-stopped \
              --env-file ~/spos-backend.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/spos-backend:latest